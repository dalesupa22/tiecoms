[package]
name = "chaggu-desktop"
version = "0.3.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-deep-link = "2.5.0"
tauri-plugin-notification = "2.5.0"
tauri-plugin-opener = "2.6.0"
tauri-plugin-single-instance = { version = "2.5.0", features = ["deep-link"] }
tauri-plugin-window-state = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
