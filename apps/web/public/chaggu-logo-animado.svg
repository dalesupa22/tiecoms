<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -1030 3647 1590"><style>
.l{opacity:0;transform:translateY(70px);animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards}
.l2{animation-delay:.06s}.l3{animation-delay:.12s}.l4{animation-delay:.5s}
.bw,.bo{transform-box:fill-box;transform-origin:50% 40%;transform:scale(0);animation:pop .6s cubic-bezier(.34,1.56,.64,1) .18s forwards}
.bo{transform-origin:45% 30%;animation:popo .7s cubic-bezier(.34,1.7,.64,1) .42s forwards}
.s{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .3s ease-out forwards,twinkle 5s ease-in-out 1.6s infinite}
.s:nth-child(1){animation-delay:.9s,1.6s}.s:nth-child(2){animation-delay:.97s,1.7s}.s:nth-child(3){animation-delay:1.04s,1.8s}
.sp{transform-box:fill-box;transform-origin:0% 100%}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes popo{0%{transform:scale(0) rotate(-18deg)}100%{transform:scale(1) rotate(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes twinkle{0%,84%,100%{opacity:1}90%{opacity:.25}95%{opacity:1}}
@media (prefers-reduced-motion:reduce){.l,.bw,.bo,.s{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
