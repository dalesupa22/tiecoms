# En chaggu.com, www y el dominio anterior: los links de la app van directo a app.chaggu.com
# (si la app no está instalada, se abre la web en la misma ruta).
location ~ ^/(c|w|invite)/ { return 302 https://app.chaggu.com$request_uri; }
location = /signup { return 302 https://app.chaggu.com$request_uri; }
