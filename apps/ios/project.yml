name: TieComs
options:
  bundleIdPrefix: com.chaggu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: B76US7H3L3
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.6.0"
    CURRENT_PROJECT_VERSION: "9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  TieComs:
    type: application
    platform: iOS
    sources:
      - path: TieComs
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - target: TieComsShare
        embed: true
      - target: TieComsNotifications
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaggu.app
        # Perfil App Store manual (ExportOptions.plist y archivo sin sesión en Xcode).
        CHAGGU_APPSTORE_PROFILE: "Chaggu App Store"
        PRODUCT_NAME: TieComs
        INFOPLIST_FILE: TieComs/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TieComs/Resources/TieComs.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
    info:
      path: TieComs/Resources/Info.plist
      properties:
        CFBundleDisplayName: Chaggu
        CFBundleName: Chaggu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        CFBundleAllowMixedLocalizations: true
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [INSendMessageIntent]
        NSCameraUsageDescription: Chaggu uses the camera when you choose to take a profile or group photo, or a photo or video to attach.
        NSMicrophoneUsageDescription: Chaggu uses the microphone to record the voice notes you send in your conversations.
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.chaggu.app
            CFBundleURLSchemes: [chaggu]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: []
  TieComsShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TieComsShare
        excludes: ["Info.plist"]
      - TieComs/Core/Models.swift
      - TieComs/Core/ModelsV2.swift
      - TieComs/Core/APIClient.swift
      - TieComs/Core/Storage.swift
      - TieComs/Core/SharedText.swift
      - TieComs/Core/L10n.swift
      - TieComs/Core/Naming.swift
      - TieComs/Core/SocketIOProtocol.swift
      - TieComs/Core/Attachments.swift
      - TieComs/Core/ShareItems.swift
      - path: TieComs/Resources
        includes: ["*.lproj/Localizable.strings", "PrivacyInfo.xcprivacy"]
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaggu.app.share
        # Perfil App Store manual (ExportOptions.plist y archivo sin sesión en Xcode).
        CHAGGU_APPSTORE_PROFILE: "Chaggu Share App Store"
        PRODUCT_NAME: TieComsShare
        INFOPLIST_FILE: TieComsShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: TieComsShare/TieComsShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SHARE_EXTENSION
    info:
      path: TieComsShare/Info.plist
      properties:
        CFBundleDisplayName: Chaggu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Mismo texto que ShareItems.activationRule (una prueba unitaria los compara).
            NSExtensionActivationRule: 'SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.data" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.content" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text").@count >= 1 AND SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.item").@count <= 10).@count >= 1'
            IntentsSupported: [INSendMessageIntent]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  TieComsNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: TieComsNotifications
        excludes: ["Info.plist"]
      - TieComs/Core/PushPayload.swift
      - TieComs/Core/CommunicationNotification.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaggu.app.notifications
        # Perfil App Store manual (ExportOptions.plist y archivo sin sesión en Xcode).
        CHAGGU_APPSTORE_PROFILE: "Chaggu Notifications App Store"
        PRODUCT_NAME: TieComsNotifications
        INFOPLIST_FILE: TieComsNotifications/Info.plist
        CODE_SIGN_ENTITLEMENTS: TieComsNotifications/TieComsNotifications.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: TieComsNotifications/Info.plist
      properties:
        CFBundleDisplayName: Chaggu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  TieComsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TieComsTests]
    dependencies:
      - target: TieComs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaggu.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TieComs.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TieComs
        BUNDLE_LOADER: $(TEST_HOST)
  TieComsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TieComsUITests]
    dependencies:
      - target: TieComs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaggu.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TieComs
schemes:
  TieComs:
    build:
      targets:
        TieComs: all
        TieComsTests: [test]
        TieComsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: TieComsTests
        - name: TieComsUITests
    archive:
      config: Release
