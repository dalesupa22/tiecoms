# Chaggu: puerto 80 (desafío de Let's Encrypt y redirección a https).
# Va aparte de tiecoms.conf porque no necesita certificado: así se puede emitir el
# de chaggu.com antes de activar los server 443.
server {
    listen 80;
    listen [::]:80;
    server_name chaggu.com www.chaggu.com app.chaggu.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://$host$request_uri; }
}
