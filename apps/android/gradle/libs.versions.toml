[versions]
agp = "8.13.2"
kotlin = "2.3.21"
composeBom = "2025.10.01"
activityCompose = "1.11.0"
navigation = "2.9.5"
lifecycle = "2.9.4"
work = "2.10.1"
sharetarget = "1.2.0"
media3 = "1.8.0"
coreKtx = "1.17.0"
coroutines = "1.10.2"
serialization = "1.9.0"
okhttp = "4.12.0"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestExt = "1.3.0"
