# Chaggu (antes TieComs): landing en www.chaggu.com, app y API en app.chaggu.com.
# tiecoms.com queda como dominio anterior: redirige a chaggu.com, pero app.tiecoms.com
# sigue atendiendo el API y los enlaces universales para las versiones de las apps
# publicadas con el nombre anterior. El puerto 80 de chaggu.com está en chaggu-http.conf
# (se instala antes que el certificado para poder emitirlo).
server {
    listen 80;
    listen [::]:80;
    server_name tiecoms.com www.tiecoms.com app.tiecoms.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chaggu.com;
    ssl_certificate /etc/nginx/tiecoms/tls-chaggu/fullchain.pem;
    ssl_certificate_key /etc/nginx/tiecoms/tls-chaggu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/tiecoms/app-links.conf;
    include /etc/nginx/tiecoms/app-links-redirect.conf;
    location / { return 308 https://www.chaggu.com$request_uri; }
}

# ---------- Landing ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.chaggu.com;

    ssl_certificate /etc/nginx/tiecoms/tls-chaggu/fullchain.pem;
    ssl_certificate_key /etc/nginx/tiecoms/tls-chaggu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TieComsTLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/tiecoms/cloudflare-realip.conf;
    if ($tiecoms_cloudflare_peer = 0) { return 403; }

    root /opt/tiecoms/web/current/site;
    index index.html;
    client_max_body_size 16k;
    include /etc/nginx/tiecoms/security-headers.conf;
    access_log /var/log/nginx/tiecoms.access.log;
    error_log /var/log/nginx/tiecoms.error.log warn;

    location ~* ^/(wp-admin|wp-login|xmlrpc\.php|\.env|\.git|cgi-bin|phpmyadmin)(/|$) { return 444; }

    include /etc/nginx/tiecoms/app-links.conf;
    include /etc/nginx/tiecoms/app-links-redirect.conf;

    # La app vive en su subdominio; la antigua demo estática lleva a la app real.
    location = /app { return 301 https://app.chaggu.com/; }
    location ^~ /app/ { rewrite ^/app/(.*)$ https://app.chaggu.com/$1 permanent; }
    location ~ ^/(producto|product)(\.html)?$ { return 301 https://app.chaggu.com/signup; }

    location ~* \.(css|js|svg|png|ico|webmanifest|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/tiecoms/security-headers.conf;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/tiecoms/security-headers.conf;
        try_files $uri $uri/index.html $uri.html =404;
    }
}


# ---------- App ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.chaggu.com;

    ssl_certificate /etc/nginx/tiecoms/tls-chaggu/fullchain.pem;
    ssl_certificate_key /etc/nginx/tiecoms/tls-chaggu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TieComsTLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/tiecoms/cloudflare-realip.conf;
    if ($tiecoms_cloudflare_peer = 0) { return 403; }

    root /opt/tiecoms/web/current/app;
    index index.html;
    client_max_body_size 128k;
    include /etc/nginx/tiecoms/security-headers.conf;
    access_log /var/log/nginx/tiecoms-app.access.log;
    error_log /var/log/nginx/tiecoms-app.error.log warn;

    location ~* ^/(wp-admin|wp-login|xmlrpc\.php|\.env|\.git|cgi-bin|phpmyadmin)(/|$) { return 444; }

    include /etc/nginx/tiecoms/api-locations.conf;
    include /etc/nginx/tiecoms/app-links.conf;

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/tiecoms/security-headers.conf;
        try_files $uri =404;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; include /etc/nginx/tiecoms/security-headers.conf; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "public, max-age=3600"; include /etc/nginx/tiecoms/security-headers.conf; try_files $uri =404; }
    location ~* \.(svg|png|ico)$ { expires 1d; add_header Cache-Control "public, max-age=86400"; include /etc/nginx/tiecoms/security-headers.conf; try_files $uri =404; }
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/tiecoms/security-headers.conf;
        try_files $uri /index.html;
    }
}

# ---------- Dominio anterior: tiecoms.com ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tiecoms.com www.tiecoms.com;
    ssl_certificate /etc/nginx/tiecoms/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tiecoms/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/tiecoms/app-links.conf;
    include /etc/nginx/tiecoms/app-links-redirect.conf;
    location / { return 301 https://www.chaggu.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.tiecoms.com;
    ssl_certificate /etc/nginx/tiecoms/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tiecoms/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TieComsTLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/tiecoms/cloudflare-realip.conf;
    if ($tiecoms_cloudflare_peer = 0) { return 403; }
    client_max_body_size 128k;
    include /etc/nginx/tiecoms/security-headers.conf;
    access_log /var/log/nginx/tiecoms-app.access.log;
    error_log /var/log/nginx/tiecoms-app.error.log warn;

    # Apps publicadas con el nombre anterior: API, tiempo real y enlaces siguen aquí.
    include /etc/nginx/tiecoms/api-locations.conf;
    include /etc/nginx/tiecoms/app-links.conf;
    location / { return 301 https://app.chaggu.com$request_uri; }
}
