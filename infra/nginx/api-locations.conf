# Proxy del API y del tiempo real (incluido en el server de app.tiecoms.com).
location ^~ /api/socket.io/ {
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tiecoms_connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
}

location ^~ /api/v1/auth/ {
    limit_req zone=tiecoms_auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    add_header Cache-Control "no-store" always;
    include /etc/nginx/tiecoms/security-headers.conf;
}

location ^~ /api/ {
    limit_req zone=tiecoms_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/tiecoms/security-headers.conf;
}
