# Proxy del API y del tiempo real (incluido en el server de app.tiecoms.com).
location ^~ /api/socket.io/ {
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tiecoms_connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
}

location ^~ /api/v1/auth/ {
    # Keep request/status diagnostics in the sanitized access log; error logs cannot redact query secrets.
    location ~ ^/api/v1/auth/(google|microsoft)/callback$ {
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:3020;
    }
    limit_req zone=tiecoms_auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    add_header Cache-Control "no-store" always;
    include /etc/nginx/tiecoms/security-headers.conf;
}

# Subida de la foto de perfil (el resto del API acepta como máximo 128k).
location = /api/v1/me/avatar {
    client_max_body_size 3m;
    limit_req zone=tiecoms_api burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/tiecoms/security-headers.conf;
}

# Subida de archivos al árbol (hasta 25 MB).
location = /api/v1/drive/files {
    client_max_body_size 26m;
    client_body_timeout 120s;
    limit_req zone=tiecoms_api burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_request_buffering on;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/tiecoms/security-headers.conf;
}

# Adjuntos del chat: fotos, archivos y notas de voz (hasta 25 MB, como MAX_ATTACHMENT_BYTES) y sus miniaturas
# (512 KB). Sin esto caían en el límite general de 128k y una nota de voz de más de ~30 s respondía 413.
# Van como prefijos ^~ (más largos que /api/, que no deja evaluar regex) con la ruta exacta anidada; el resto de
# /api/v1/conversations/ y /api/v1/attachments/ se comporta igual que /api/.
location ^~ /api/v1/conversations/ {
    # Videos (docs/VIDEO.md): hasta 150 MB por stream. Sin buffer en nginx (proxy_request_buffering off): el cuerpo
    # pasa directo al API, que lo sube a S3 en partes de 5 MB; así no se escribe en el disco del servidor (94 %).
    location ~ "^/api/v1/conversations/[0-9a-fA-F-]{36}/videos$" {
        client_max_body_size 151m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        limit_req zone=tiecoms_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        include /etc/nginx/tiecoms/security-headers.conf;
    }
    location ~ "^/api/v1/conversations/[0-9a-fA-F-]{36}/attachments$" {
        client_max_body_size 26m;
        client_body_timeout 120s;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        limit_req zone=tiecoms_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        include /etc/nginx/tiecoms/security-headers.conf;
    }
    limit_req zone=tiecoms_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/tiecoms/security-headers.conf;
}

location ^~ /api/v1/attachments/ {
    location ~ "^/api/v1/attachments/[0-9a-fA-F-]{36}/thumb$" {
        client_max_body_size 1m;
        limit_req zone=tiecoms_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        include /etc/nginx/tiecoms/security-headers.conf;
    }
    limit_req zone=tiecoms_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    # Videos viejos o apps sin /play: el API los sirve por stream; nginx no los copia a archivos temporales en disco.
    proxy_max_temp_file_size 0;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/tiecoms/security-headers.conf;
}

# Fotos de perfil y miniaturas de enlaces: el API manda Cache-Control inmutable (el id nunca se reutiliza).
# Prefijos ^~ más largos que /api/: así ganan sobre él (una regex no se evaluaría).
location ^~ /api/v1/avatars/ {
    limit_req zone=tiecoms_api burst=120 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    include /etc/nginx/tiecoms/security-headers.conf;
}

location ^~ /api/v1/previews/ {
    limit_req zone=tiecoms_api burst=120 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    include /etc/nginx/tiecoms/security-headers.conf;
}

location ^~ /api/ {
    location ^~ /api/hooks/ {
        # The token may be in the path. Preserve sanitized access diagnostics only.
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:3020;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /api/v1/meetings/zoom/callback {
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:3020;
    }
    limit_req zone=tiecoms_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/tiecoms/security-headers.conf;
}
