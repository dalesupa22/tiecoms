<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#f6f3ec">
  <link rel="icon" type="image/png" href="/assets/tiecoms-favicon.png">
  <link rel="alternate" hreflang="es" href="https://www.tiecoms.com{{path_es}}">
  <link rel="alternate" hreflang="en" href="https://www.tiecoms.com{{path_en}}">
  <link rel="stylesheet" href="/landing.css">
  <link rel="stylesheet" href="/legal.css">
  <title>{{title}} · TieComs</title>
</head>
<body class="legal-page">
  <header class="site-header is-scrolled">
    <a class="brand" href="{{home}}" aria-label="TieComs"><img src="/assets/tiecoms.svg" alt="TieComs"></a>
    <div class="header-actions legal-actions">
      <a class="text-link lang-link" href="{{alt_path}}" hreflang="{{alt_lang}}" lang="{{alt_lang}}">{{alt_label}}</a>
      <a class="text-link" href="https://app.tiecoms.com/">{{app_label}} <span aria-hidden="true">→</span></a>
    </div>
  </header>
  <main class="legal">
    <p class="eyebrow"><span class="eyebrow-dot eyebrow-dot-orange"></span> {{eyebrow}}</p>
    <h1>{{title}}</h1>
    <p class="legal-updated">{{updated}}</p>
{{body}}
  </main>
  <footer class="site-footer"><a class="brand brand-footer" href="{{home}}"><img src="/assets/tiecoms.svg" alt="TieComs"></a><p>{{tagline}}</p><div class="footer-links">{{footer_links}}</div><small>© 2026 TieComs</small></footer>
</body>
</html>
