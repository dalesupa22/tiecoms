# Links universales (iOS) y App Links (Android): el sistema abre la app TieComs
# para /c/, /w/, /invite/ y /signup?org= en los tres dominios. Deben servirse
# sin redirección y como JSON. Tras activar Play App Signing, añadir aquí el
# SHA-256 del certificado de firma de Google Play junto al de subida.
location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    return 200 '{"applinks":{"details":[{"appIDs":["B76US7H3L3.com.tiecoms.app"],"components":[{"/":"/c/*"},{"/":"/w/*"},{"/":"/invite/*"},{"/":"/signup","?":{"org":"?*"}}]}]},"webcredentials":{"apps":["B76US7H3L3.com.tiecoms.app"]}}';
}
location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    return 200 '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.tiecoms.app","sha256_cert_fingerprints":["12:2C:D6:DA:89:5C:D5:D6:39:55:D9:C4:0A:9A:89:80:41:51:94:98:59:A6:40:E9:29:A5:02:2D:13:41:F4:B7"]}}]';
}
