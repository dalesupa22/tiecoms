# TieComs en una EC2. Para escalar horizontalmente: más réplicas de `api`
# detrás del balanceador (el adaptador PostgreSQL de Socket.IO reparte eventos
# entre nodos y el outbox usa SKIP LOCKED); `worker` puede vivir en otra máquina.
name: tiecoms

# The Apple signing key is available only to the API and revocation worker.
x-auth-volumes: &auth-volumes
  - type: bind
    source: /opt/tiecoms/shared/rds-ca.pem
    target: /run/secrets/rds-ca.pem
    read_only: true
  - type: bind
    source: /opt/tiecoms/shared/apple-auth
    target: /run/secrets/apple-auth
    read_only: true
    bind: { create_host_path: false }

x-common: &common
  image: "tiecoms-api:${TIECOMS_RELEASE:?set_release}"
  env_file: /opt/tiecoms/shared/api.env
  restart: unless-stopped
  logging:
    driver: local
    options: { max-size: "20m", max-file: "5" }
  volumes:
    - type: bind
      source: /opt/tiecoms/shared/rds-ca.pem
      target: /run/secrets/rds-ca.pem
      read_only: true
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]

services:
  api:
    <<: *common
    volumes: *auth-volumes
    ports: ["127.0.0.1:3020:3020"]
    environment:
      INSTANCE_ID: api-1
      PORT: "3020"
      # Heap explícito (antes ~256 MB por defecto con 512M): el 11/12-oct se cayó 3 veces por heap out of memory.
      # El vigilante (memory-watch.ts) reinicia ordenado al 85 % de este tope; los PDF se leen en un hilo aparte.
      NODE_OPTIONS: "--max-old-space-size=1024"
    stop_grace_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1536M, pids: 256 }

  worker:
    <<: *common
    volumes: *auth-volumes
    command: ["node", "--enable-source-maps", "worker.js"]
    environment:
      INSTANCE_ID: worker-1
      DB_POOL_MAX: "5"
    healthcheck:
      # Latido del ciclo (src/watchdog.ts): sin vueltas en 2 min se ve «unhealthy»; a los 5 min el proceso sale solo.
      # find y no node: un segundo node dentro de un límite de 256M cada 30 s pesa.
      test: ["CMD-SHELL", "find /tmp/worker.alive -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M, pids: 64 }

  # Conectar WhatsApp: una sesión (dispositivo vinculado) por cuenta conectada.
  wa:
    <<: *common
    command: ["node", "--enable-source-maps", "wa-bridge.js"]
    environment:
      INSTANCE_ID: wa-1
      DB_POOL_MAX: "4"
    stop_grace_period: 15s
    healthcheck:
      # Latido del ciclo (src/watchdog.ts): sin vueltas en 2 min se ve «unhealthy»; a los 5 min el proceso sale solo.
      # find y no node: un segundo node dentro de un límite de 256M cada 30 s pesa.
      test: ["CMD-SHELL", "find /tmp/wa.alive -mmin -6 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 512M, pids: 128 }
