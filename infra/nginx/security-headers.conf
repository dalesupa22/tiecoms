# Se incluye en el server y en cada location que use add_header (nginx no hereda add_header).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy $tiecoms_referrer_policy always;
add_header X-Frame-Options DENY always;
# Llamadas, notas de voz y gg usan micrófono y cámara: permitidos solo para el propio sitio.
# Con camera=()/microphone=() el navegador bloquea getUserMedia sin preguntar (NotAllowedError).
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;
# Chime: señalización wss://signal.*.chime.aws, TURN y métricas en https://*.chime.aws.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss://app.chaggu.com wss://app.tiecoms.com https://*.chime.aws wss://*.chime.aws https://cloudflareinsights.com; media-src 'self' blob: data: https://*.amazonaws.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

