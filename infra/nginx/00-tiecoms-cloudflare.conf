# TieComs: variable de origen Cloudflare (contexto http). No cambia otras webs del host.
# Rangos oficiales: https://www.cloudflare.com/ips-v4 · https://www.cloudflare.com/ips-v6 (verificados 2026-09-23).
geo $realip_remote_addr $tiecoms_cloudflare_peer {
    default 0;
    # Loopback: solo verificaciones desde el propio servidor.
    127.0.0.1 1;
    ::1 1;
    173.245.48.0/20 1; 103.21.244.0/22 1; 103.22.200.0/22 1; 103.31.4.0/22 1;
    141.101.64.0/18 1; 108.162.192.0/18 1; 190.93.240.0/20 1; 188.114.96.0/20 1;
    197.234.240.0/22 1; 198.41.128.0/17 1; 162.158.0.0/15 1; 104.16.0.0/13 1;
    104.24.0.0/14 1; 172.64.0.0/13 1; 131.0.72.0/22 1;
    2400:cb00::/32 1; 2606:4700::/32 1; 2803:f800::/32 1; 2405:b500::/32 1;
    2405:8100::/32 1; 2a06:98c0::/29 1; 2c0f:f248::/32 1;
}

limit_req_zone $binary_remote_addr zone=tiecoms_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tiecoms_auth:10m rate=3r/s;

map $http_upgrade $tiecoms_connection_upgrade {
    default upgrade;
    ''      close;
}
